[Unit]
# event-exporter tails the journal with "--since now", so AosCore must start after the whole
# benchmark stack, or its earliest [profiling] checkpoints (e.g. "Init IAM") would be missed.
# aos-cm.service and aos-sm.service are themselves ordered After=aos-iam.service, so this also
# orders them after benchmark.target transitively - no need to repeat this drop-in on every
# AosCore unit.
After=benchmark.target
